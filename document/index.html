<!doctype html>
<html lang="ko">
<head>

<title>도깨비 세벌체 미리보기</title>
<style>
:root{--bg:#f4f4f1;--paper:#fff;--ink:#111;--muted:#777;--line:#d7d7d2;--soft:#ecece8;--danger:#9b1c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}button{background:#fff;border:1px solid var(--line);padding:8px 11px;cursor:pointer}button:hover{background:var(--soft)}button.primary{background:#111;color:#fff;border-color:#111}.app{min-height:100vh}.top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:18px;position:sticky;top:0;z-index:20}.brand{font-weight:700;white-space:nowrap}.tabs{display:flex;height:100%}.tab{border:0;border-bottom:2px solid transparent;background:transparent;padding:0 16px}.tab.active{border-bottom-color:#111}.top-actions{margin-left:auto;display:flex;gap:6px}.page{display:none}.page.active{display:block}.workspace{display:grid;grid-template-columns:310px minmax(430px,1fr) 310px;min-height:calc(100vh - 58px)}.panel{background:#fff;border-right:1px solid var(--line);padding:16px;overflow:auto}.panel.right{border-right:0;border-left:1px solid var(--line)}.stage-wrap{padding:22px;overflow:auto}.stage{background:#fff;min-height:700px;border:1px solid var(--line);position:relative;padding:24px}.section{margin-bottom:22px}.section h3{font-size:13px;margin:0 0 10px}.muted{color:var(--muted);font-size:12px;line-height:1.5}.row{display:flex;align-items:center;gap:8px;margin:8px 0}.row label{min-width:82px;color:#444}.row input[type=number]{width:82px}.row input[type=range]{flex:1}.row select,.row input[type=text]{min-width:0;flex:1}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.seg button.active{background:#111;color:#fff;border-color:#111}.drop{border:1px dashed #aaa;padding:16px;text-align:center;background:#fafafa}.list{display:flex;flex-direction:column;gap:6px;margin-top:10px}.item{border:1px solid var(--line);padding:8px;display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;cursor:pointer}.item.active{outline:2px solid #111}.thumb{width:42px;height:42px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}.thumb svg{width:100%;height:100%}.badge{font-size:11px;color:#666}.danger{color:var(--danger)}.compose-area{min-height:590px;display:flex;align-items:flex-start;justify-content:center;overflow:auto;position:relative}.sample-glyphs{display:flex;align-items:flex-start;justify-content:center;gap:28px;flex-wrap:wrap;width:100%}.sample-unit{display:flex;flex-direction:column;align-items:center;gap:8px}.sample-unit-label{font-size:12px;color:var(--muted)}.glyph-host{position:relative}.guide-box{position:absolute;border:1px dashed #aaa;pointer-events:none}.guide-axis{position:absolute;background:#d0d0d0;pointer-events:none}.guide-axis.v{width:1px;top:0;bottom:0}.guide-axis.h{height:1px;left:0;right:0}.component-box{position:absolute;overflow:visible;z-index:1}.component-box.selected{outline:1px solid #111}.component-box svg{width:100%;height:100%;display:block;overflow:visible}.component-label{position:absolute;left:100%;top:0;margin-left:5px;font-size:10px;color:#777;white-space:nowrap}.missing{border:1px dashed var(--danger);color:var(--danger);display:flex;align-items:center;justify-content:center;text-align:center;padding:5px;font-size:11px}.preview-layout{display:grid;grid-template-columns:330px 1fr;min-height:calc(100vh - 58px)}.preview-controls{background:#fff;border-right:1px solid var(--line);padding:18px;overflow:auto}.preview-stage{padding:24px;overflow-y:auto;overflow-x:hidden;min-width:0;max-width:100%}.preview-paper{background:#fff;border:1px solid var(--line);min-height:760px;padding:36px;overflow-x:hidden;overflow-y:visible;min-width:0;max-width:100%}.text-input{width:100%;height:140px;resize:vertical;padding:10px;border:1px solid var(--line)}.vertical-output{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;min-height:600px;gap:var(--row-gap,28px);min-width:0;max-width:100%}.vrow{display:flex;flex-direction:row-reverse;align-items:flex-start;justify-content:flex-start;gap:var(--col-gap,28px);width:100%}.vcol{display:flex;flex-direction:column;align-items:center;gap:var(--char-gap,16px);flex:0 0 var(--column-width,220px);width:var(--column-width,220px);overflow:visible}.preview-glyph{cursor:pointer;position:relative;flex:none}.space-marker{height:var(--space-size,40px);width:20px}.inspect-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50}.inspect-overlay.open{display:flex}.inspect{width:min(900px,92vw);height:min(760px,90vh);background:#fff;border:1px solid #111;display:grid;grid-template-rows:auto 1fr}.inspect-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.inspect-head button{margin-left:auto}.inspect-body{position:relative;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:40px}.check{display:flex;align-items:center;gap:7px}.hr{height:1px;background:var(--line);margin:14px 0}.file-input{display:none}.grid-page{padding:20px}.grid-toolbar{background:#fff;border:1px solid var(--line);padding:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;position:sticky;top:58px;z-index:10}.grid-toolbar label{display:flex;align-items:center;gap:6px}.glyph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:14px}.grid-cell{background:#fff;border:1px solid var(--line);min-height:165px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;cursor:pointer}.grid-cell:hover{outline:1px solid #111}.grid-char{font-size:13px;font-weight:700;margin-bottom:6px}.grid-glyph-slot{height:125px;width:100%;display:flex;align-items:flex-start;justify-content:center;overflow:hidden}.grid-empty{padding:50px;text-align:center;color:var(--muted)}.auto-note{font-size:11px;color:var(--muted);margin-top:6px}.status{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 12px;opacity:0;pointer-events:none;transition:.2s;z-index:99}.status.show{opacity:1}@media(max-width:1000px){.workspace{grid-template-columns:280px 1fr}.panel.right{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.preview-layout{grid-template-columns:290px 1fr}}@media(max-width:760px){.workspace,.preview-layout{display:block}.panel,.preview-controls{border-right:0;border-bottom:1px solid var(--line)}.top{flex-wrap:wrap;height:auto;padding:8px}.top-actions{width:100%;margin-left:0}.stage-wrap,.preview-stage{padding:10px}}
.spacing-guide{position:absolute;pointer-events:none;background:rgba(255,220,0,.32);z-index:0}
.writing-mode{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:8px 0 12px}.writing-mode button.active{background:#111;color:#fff;border-color:#111}
.horizontal-output{display:flex;flex-direction:column;align-items:flex-start;width:100%;max-width:100%;min-width:0;min-height:600px;gap:var(--line-gap,16px)}.hrow{position:relative;width:100%;min-width:0}.hglyph{position:absolute;cursor:pointer}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">도깨비 세벌체 미리보기</div><nav class="tabs"><button class="tab active" data-page="setup">벡터·조합 설정</button><button class="tab" data-page="typing">타이핑 미리보기</button><button class="tab" data-page="grid">글자 그리드</button></nav><div class="top-actions"><button id="saveProject">프로젝트 저장</button><button id="loadProjectBtn">프로젝트 불러오기</button><button id="exportSvg">미리보기 SVG 저장</button><input id="loadProject" class="file-input" type="file" accept="application/json,.json"></div></header>
<section id="setup" class="page active"><div class="workspace">
<aside class="panel"><div class="section"><h3>벡터 분류</h3><div class="seg" id="categorySeg"><button data-cat="initial" class="active">첫닿자</button><button data-cat="vowel">홀자</button><button data-cat="final">받침</button></div></div><div class="section"><h3>SVG 등록</h3><div class="drop"><div>SVG 파일을 선택하세요</div><p class="muted">한 번에 여러 파일을 선택할 수 있습니다.</p><button id="uploadBtn">SVG 선택</button><input id="svgFiles" class="file-input" type="file" accept="image/svg+xml,.svg" multiple></div><div class="row"><label>자모/역할</label><select id="assignJamo"></select></div><div class="row"><label>이름</label><input id="assetName" type="text" placeholder="예: ㄱ 머리"></div><button id="addAsset" class="primary" style="width:100%">선택 SVG 등록</button></div><div class="section"><h3>등록된 요소</h3><div id="assetList" class="list"></div></div></aside>
<main class="stage-wrap"><div class="stage"><div class="row" style="justify-content:space-between;margin-top:0"><div><strong>대표 글자 조합</strong><div class="muted">설정을 바꾸면 바로 반영됩니다.</div></div><div class="row"><label style="min-width:auto">대표 글자</label><input id="sampleChar" type="text" value="강 한 글" placeholder="예: 강 한 글" style="width:150px;text-align:center;font-size:18px"></div></div><div class="hr"></div><div class="compose-area" id="composeArea"><div id="sampleGlyph" class="sample-glyphs"></div></div></div></main>
<aside class="panel right"><div class="section"><h3>공통 조합 설정</h3><div class="row"><label>기준 폭</label><input id="baseWidth" type="number" min="40" value="220"></div><div class="row"><label>첫→홀 간격</label><input id="gapIV" type="number" value="50"></div><div class="row"><label>홀→받침</label><input id="gapVF" type="number" value="0"></div><div class="row"><label>복합 홀자</label><input id="gapVV" type="number" value="50"></div><div class="row"><label>좌우 여백</label><input id="sidePadding" type="number" value="20"></div><label class="check"><input id="showGuidesSetup" type="checkbox" checked> 기준선·경계 표시</label></div><div class="section"><h3>선택 요소 개별 보정</h3><div id="noSelection" class="muted">왼쪽 목록에서 요소를 선택하세요.</div><div id="assetControls" style="display:none"><div class="row"><label>요소</label><strong id="selectedLabel"></strong></div><div class="row"><label>크기 %</label><input id="assetScale" type="range" min="20" max="250" value="100"><span id="assetScaleVal">100</span></div><div class="row"><label>X 보정</label><input id="assetX" type="number" value="0"></div><div class="row"><label>Y 보정</label><input id="assetY" type="number" value="0"></div><div class="row"><label>위 간격</label><input id="assetBefore" type="number" value="0"></div><div class="row"><label>아래 간격</label><input id="assetAfter" type="number" value="0"></div><button id="replaceBtn">SVG 교체</button><button id="deleteBtn" class="danger">삭제</button><input id="replaceFile" class="file-input" type="file" accept="image/svg+xml,.svg"></div></div></aside>
</div></section>
<section id="typing" class="page"><div class="preview-layout"><aside class="preview-controls"><div class="section"><h3>문장 입력</h3><textarea id="typingText" class="text-input">아기도깨비</textarea></div><div class="section"><h3>미리보기 설정</h3><div class="writing-mode"><button id="verticalModeBtn" class="active">세로쓰기</button><button id="horizontalModeBtn">가로쓰기</button></div><div class="row"><label>글자 크기</label><input id="fontSize" type="range" min="40" max="240" value="60"><span id="fontSizeVal">60</span></div><div class="row"><label>글자 간격</label><input id="charGap" type="number" value="18"></div><div class="row"><label>열 간격</label><input id="colGap" type="number" value="16"></div><div class="row"><label>공백 높이</label><input id="spaceSize" type="number" value="5"></div><label class="check"><input id="showGuidesPreview" type="checkbox"> 안내선 표시</label></div><div class="section"><h3>누락 요소</h3><div id="missingList" class="muted">없음</div></div><div class="section"><p class="muted">글자를 클릭하면 확대 검사 모드에서 요소 경계와 기준선을 확인할 수 있습니다.</p></div></aside><main class="preview-stage"><div class="preview-paper"><div id="verticalOutput" class="vertical-output"></div></div></main></div></section>
<section id="grid" class="page"><div class="grid-page">
<div class="grid-toolbar">
<strong>글자 그리드</strong>
<label>첫닿자 <select id="gridInitial"></select></label>
<label>홀자 <select id="gridVowel"></select></label>
<label>받침 <select id="gridFinal"></select></label>
<label class="check"><input id="gridBuildable" type="checkbox" checked> 등록된 요소로 만들 수 있는 글자만</label>
<label class="check"><input id="gridIncludeTemp" type="checkbox" checked> 임시 벡터 포함</label>
<span id="gridCount" class="muted"></span>
</div>
<div id="glyphGrid" class="glyph-grid"></div>
</div></section>
</div>
<div id="inspectOverlay" class="inspect-overlay"><div class="inspect"><div class="inspect-head"><strong id="inspectTitle">글자 검사</strong><label class="check"><input id="inspectGuides" type="checkbox" checked> 안내선</label><button id="closeInspect">닫기</button></div><div id="inspectBody" class="inspect-body"></div></div></div><div id="status" class="status"></div>
<script>
'use strict';
const GUIDE_GAP=9.6907;
let previewMode='vertical';
const JAMO={initial:['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'],vowel:['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'],final:['ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ']};
const ASSET_JAMO={initial:JAMO.initial,vowel:JAMO.vowel,final:['ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄸ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅃ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ']};
const COMPOUND_VOWELS={'ㅘ':['ㅗ','ㅏ'],'ㅙ':['ㅗ','ㅐ'],'ㅚ':['ㅗ','ㅣ'],'ㅝ':['ㅜ','ㅓ'],'ㅞ':['ㅜ','ㅔ'],'ㅟ':['ㅜ','ㅣ'],'ㅢ':['ㅡ','ㅣ']};
const state={version:3,category:'initial',assets:{initial:{},vowel:{},final:{}},settings:{baseWidth:220,gapIV:50,gapVF:0,gapVV:50,sidePadding:20,visualBounds:true},selected:null,pendingFiles:[]};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function status(msg){const e=$('#status');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}
function decompose(ch){const n=ch.codePointAt(0)-0xAC00;if(n<0||n>11171)return null;const i=Math.floor(n/588),v=Math.floor((n%588)/28),f=n%28;return {initial:JAMO.initial[i],vowel:JAMO.vowel[v],final:f?JAMO.final[f-1]:null}}
function vowelParts(v){return COMPOUND_VOWELS[v]||[v]}
function composeSyllable(i,v,f=null){const ii=JAMO.initial.indexOf(i),vi=JAMO.vowel.indexOf(v),fi=f?JAMO.final.indexOf(f)+1:0;return String.fromCodePoint(0xAC00+(ii*21+vi)*28+fi)}
function assetUsable(cat,j,includeTemp=true){const a=state.assets[cat][j];return !!a&&(includeTemp||!a.temp)}
function syllableBuildable(i,v,f,includeTemp=true){return assetUsable('initial',i,includeTemp)&&vowelParts(v).every(x=>assetUsable('vowel',x,includeTemp))&&(!f||assetUsable('final',f,includeTemp))}
function parseSvg(text){const p=new DOMParser().parseFromString(text,'image/svg+xml');const svg=p.documentElement;if(svg.nodeName.toLowerCase()!=='svg'||p.querySelector('parsererror'))throw new Error('올바른 SVG가 아닙니다.');let vb=svg.getAttribute('viewBox');let w=Number.parseFloat(svg.getAttribute('width'))||100,h=Number.parseFloat(svg.getAttribute('height'))||100;if(vb){const a=vb.trim().split(/[ ,]+/).map(Number);if(a.length===4&&a.every(Number.isFinite)){w=a[2];h=a[3]}}else svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.removeAttribute('width');svg.removeAttribute('height');return {svg:svg.outerHTML,ratio:w/h||1,viewBox:svg.getAttribute('viewBox')};}
function placeholderSvg(cat,j){const shapes={initial:`<rect x="18" y="25" width="64" height="52" rx="5" fill="#111"/><circle cx="40" cy="50" r="5" fill="white"/><circle cx="60" cy="50" r="5" fill="white"/><rect x="30" y="10" width="10" height="10"/><rect x="60" y="10" width="10" height="10"/>`,vowel:`<rect x="46" y="10" width="8" height="80"/><circle cx="50" cy="50" r="12" fill="white" stroke="#111" stroke-width="7"/>`,final:`<path d="M20 20h60v38a30 30 0 0 1-60 0z"/><circle cx="40" cy="52" r="5" fill="white"/><circle cx="60" cy="52" r="5" fill="white"/>`};return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-label="${j}">${shapes[cat]}</svg>`}
function seed(){[['initial','ㅇ'],['initial','ㄱ'],['initial','ㄷ'],['initial','ㅂ'],['vowel','ㅏ'],['vowel','ㅣ'],['vowel','ㅗ'],['vowel','ㅐ'],['final','ㅇ'],['final','ㄱ'],['final','ㅂ']].forEach(([c,j])=>{state.assets[c][j]={name:`임시 ${j}`,jamo:j,svg:placeholderSvg(c,j),ratio:1,viewBox:'0 0 100 100',scale:100,x:0,y:0,before:0,after:0,temp:true}})}
function populateJamo(){const s=$('#assignJamo');s.innerHTML=ASSET_JAMO[state.category].map(j=>`<option value="${j}">${j}</option>`).join('')}
function renderList(){const box=$('#assetList');box.innerHTML='';ASSET_JAMO[state.category].map(j=>state.assets[state.category][j]).filter(Boolean).forEach(a=>{const d=document.createElement('div');d.className='item'+(state.selected?.cat===state.category&&state.selected?.jamo===a.jamo?' active':'');d.innerHTML=`<div class="thumb">${a.svg}</div><div><strong>${esc(a.jamo)}</strong> · ${esc(a.name)}<div class="badge">${a.temp?'임시 벡터':'사용자 SVG'}</div></div><span>›</span>`;d.onclick=()=>selectAsset(state.category,a.jamo);box.appendChild(d)});if(!box.children.length)box.innerHTML='<div class="muted">아직 등록된 요소가 없습니다.</div>'}
function selectAsset(cat,jamo){state.selected={cat,jamo};const a=state.assets[cat][jamo];$('#noSelection').style.display='none';$('#assetControls').style.display='block';$('#selectedLabel').textContent=`${jamo} / ${a.name}`;$('#assetScale').value=a.scale;$('#assetScaleVal').textContent=a.scale;$('#assetX').value=a.x;$('#assetY').value=a.y;$('#assetBefore').value=a.before;$('#assetAfter').value=a.after;renderList();renderSample()}
function syncAsset(){if(!state.selected)return;const a=state.assets[state.selected.cat][state.selected.jamo];a.scale=+$('#assetScale').value;a.x=+$('#assetX').value;a.y=+$('#assetY').value;a.before=+$('#assetBefore').value;a.after=+$('#assetAfter').value;$('#assetScaleVal').textContent=a.scale;renderSample();renderTyping()}
function getVisualBounds(asset){
  // v2: 루트 SVG의 getBBox()를 사용한다.
  // 자식 <g transform="...">의 로컬 bbox를 직접 합치면 transform이 빠져
  // ㄱ/ㄲ처럼 구조가 다른 SVG에서 실제 하단 위치가 잘못 계산될 수 있다.
  if(asset.visualBoundsVersion===2&&asset.visualBounds&&Number.isFinite(asset.visualBounds.x)&&Number.isFinite(asset.visualBounds.y)&&asset.visualBounds.width>0&&asset.visualBounds.height>0)return asset.visualBounds;
  const wrap=document.createElement('div');
  wrap.style.cssText='position:absolute;left:-100000px;top:-100000px;visibility:hidden;width:1000px;height:1000px';
  wrap.innerHTML=asset.svg;
  document.body.appendChild(wrap);
  const svg=wrap.querySelector('svg');
  let b=null;
  try{
    if(svg){
      const x=svg.getBBox();
      if(x&&x.width>0&&x.height>0)b={x:x.x,y:x.y,width:x.width,height:x.height};
    }
  }catch{}
  wrap.remove();
  if(!b||!b.width||!b.height){
    const v=(asset.viewBox||'0 0 100 100').trim().split(/[ ,]+/).map(Number);
    b={x:v[0]||0,y:v[1]||0,width:v[2]||100,height:v[3]||100};
  }
  asset.visualBounds=b;
  asset.visualBoundsVersion=2;
  return b;
}
function componentMetrics(asset,baseW){const vb=(asset.viewBox||'0 0 100 100').trim().split(/[ ,]+/).map(Number);const vbW=vb[2]||100,vbH=vb[3]||100;const referenceViewBoxWidth=200;const unitScale=(baseW/referenceViewBoxWidth)*(asset.scale/100);const width=vbW*unitScale,height=vbH*unitScale;const bounds=getVisualBounds(asset);return {width,height,unitScale,visualTop:(bounds.y-(vb[1]||0))*unitScale,visualBottom:(bounds.y+bounds.height-(vb[1]||0))*unitScale}}

async function loadDocumentProject(){
  try{
    // 공개용 문서에서는 프로젝트 데이터를 HTML 안에 함께 넣어
    // GitHub Pages와 로컬 파일 모두에서 동일하게 보이도록 한다.
    const p=DOCUMENT_PROJECT;
    if(!p?.assets||!p?.settings)throw new Error('invalid project');
    state.assets=p.assets;
    state.settings={baseWidth:220,gapIV:50,gapVF:0,gapVV:50,sidePadding:20,visualBounds:true,...p.settings};
    setInput('baseWidth',state.settings.baseWidth);
    setInput('gapIV',state.settings.gapIV);
    setInput('gapVF',state.settings.gapVF);
    setInput('gapVV',state.settings.gapVV);
    setInput('sidePadding',state.settings.sidePadding);
    const typingTab=document.querySelector('[data-page="typing"]');
    if(typingTab)typingTab.click();
    renderTyping();
    renderGrid();
  }catch(err){
    const missing=$('#missingList');
    if(missing)missing.textContent='글자 데이터를 불러올 수 없습니다.';
    console.error('도깨비 세벌체 프로젝트 로딩 오류:',err);
  }
}
document.body.classList.add('document-view');
$('#setup')?.remove();
$$('.tab').forEach(b=>{if(b.dataset.page==='setup')b.remove()});
if($('#saveProject'))$('#saveProject').style.display='none';
if($('#loadProjectBtn'))$('#loadProjectBtn').style.display='none';

loadDocumentProject();
</script>
